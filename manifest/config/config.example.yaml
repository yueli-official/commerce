# CONFIG TEMPLATE — once: cp config.example.yaml config.yaml, then set local values (DB host 192.168.5.5).
# Real config.yaml is GITIGNORED. Platform standard: backend-platform-conventions §7.
server:
  address: "127.0.0.1:8084"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    # GoFrame's pgsql driver builds the DSN from these structured fields (it does
    # NOT parse `link`). Dev: set host to 192.168.5.5. See local-dev-gotchas §6.
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "commerce"

commerce:
  # IdP JWKS for access-token verification (gokit/authjwt). Lazy-fetched.
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: ""            # "" disables the audience check

  devSettle: false          # true → auto-settle orders without real payment (dev only)
  gateways: [alipay, wechat, paypal]

  # Daily check-in reward curve (M2): points for an N-day streak =
  # base + (N-1)*step, capped at cap; a missed day resets the streak.
  checkin:
    base: 10
    step: 2
    cap: 30

  alipay:
    app_id: ""
    private_key: ""
    alipay_public_key: ""
    sandbox: true
    notify_url: ""
    return_url: ""

  paypal:
    client_id: ""
    client_secret: ""
    sandbox: true
    # Optional override for tests/proxies. Empty uses PayPal sandbox/live API base.
    base_url: ""
