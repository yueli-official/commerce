# CONFIG TEMPLATE — once: cp config.example.yaml config.yaml, then set local values (DB host 192.168.5.5).
# Real config.yaml is GITIGNORED. Platform standard: backend-platform-conventions §7.
server:
  address: "127.0.0.1:8084"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    # GoFrame's pgsql driver builds the DSN from these structured fields (it does
    # NOT parse `link`). Dev: set host to 192.168.5.5. See local-dev-gotchas §6.
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "commerce"

commerce:
  capabilityScope: "platform:capabilities:read"
  capabilityProbeScope: "platform:capabilities:probe"
  # Reject checkout/access calls that do not resolve to a registered OAuth
  # client or a valid Shop BFF assertion.
  requireTrustedSiteContext: true
  # IdP JWKS for access-token verification (gokit/authjwt). Lazy-fetched.
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: "commerce-api"

  devSettle: false          # true → auto-settle orders without real payment (dev only)
  gateways: [alipay, wechat, paypal]

  # Daily check-in reward curve (M2): points for an N-day streak =
  # base + (N-1)*step, capped at cap; a missed day resets the streak.
  checkin:
    base: 10
    step: 2
    cap: 30

  delivery:
    # Required to expose downloadUrl on delivery token pages.
    signing_secret: ""
    # Optional public origin, e.g. https://shop.example.com. Empty returns relative URLs.
    public_base_url: ""
    ttl_seconds: 900

  assetService:
    # Optional: when configured, /api/v1/delivery/{token}/download returns a real
    # asset-service delivery URL instead of only validating the commerce token.
    base_url: "http://localhost:8082"
    token_url: "http://localhost:8081/oauth2/token"
    client_id: "commerce-asset-svc"
    client_secret: ""
    scope: "asset:sign"

  shopService:
    # Required for shop checkout security: commerce re-reads the current shop
    # product variant snapshot before creating an order, so browser-supplied
    # price/delivery fields cannot be trusted. Also used by updatePolicy=latest
    # purchases before signing current delivery.
    base_url: "http://localhost:8088"

  # Managed Shop instances. Browser requests reach Commerce through the Shop
  # BFF, which signs a short-lived assertion with the same secret. Store real
  # assertion secrets in the deployment secret manager, never in Git.
  trustedSiteContexts:
    shop-ae:
      clientIds: ["shop-ae-web"]
      assertionSecret: ""
      shopBaseUrl: "http://shop-ae-api:8088"

  notificationService:
    # Optional for local dev, required if delivery-ready emails should be sent.
    base_url: "http://localhost:8089"
    token_url: "http://localhost:8081/oauth2/token"
    client_id: "commerce-notification-svc"
    client_secret: ""
    scope: "notification:send"

  alipay:
    app_id: ""
    private_key: ""
    alipay_public_key: ""
    sandbox: true
    notify_url: ""
    return_url: ""

  paypal:
    client_id: ""
    client_secret: ""
    sandbox: true
    # Optional override for tests/proxies. Empty uses PayPal sandbox/live API base.
    base_url: ""

  wechat:
    merchant_id: ""
    merchant_cert_sn: ""
    merchant_api_v3_key: ""
    private_key: ""
    app_id: ""
    notify_url: ""
